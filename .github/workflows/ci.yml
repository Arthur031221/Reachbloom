name: CI
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - if: matrix.node == 22
        run: npx playwright install --with-deps chromium
      - if: matrix.node == 22
        run: npm run check:ui
      - if: matrix.node == 22
        run: |
          python3 -m venv .venv
          PYTHON=.venv/bin/python npm run verify:reference
      - if: matrix.node == 22
        run: npm run check:package
